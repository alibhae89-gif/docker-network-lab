events {}
http {
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
  limit_req_status 429;

  upstream flask_app {
    server web:5000;
  }

  # HTTP -> HTTPS redirect (8443 is the published HTTPS port)
  server {
    listen 80;
    return 301 https://$host:8443$request_uri;
  }

  # Internal-only status page for the Prometheus exporter (port 8081 is NOT published)
  server {
    listen 8081;
    location = /stub_status {
      stub_status;
    }
  }

  server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # short HSTS for the lab; use 31536000 in production
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # never expose app metrics through the public proxy
    location = /metrics {
      return 404;
    }

    location / {
      limit_req zone=perip burst=20 nodelay;
      proxy_pass http://flask_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 2s;
      proxy_next_upstream error timeout;
    }
  }
}
